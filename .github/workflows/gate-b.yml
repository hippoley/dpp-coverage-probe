name: Gate B - pinned upstream observation
on:
  push:
    paths:
      - gate_b_bootstrap.py
      - product_acceptance.py
      - external_module_contract.mjs
      - aas_oracle_adapter.py
      - test_aas_oracle_adapter.py
      - cross_validator_comparison.py
      - test_cross_validator_comparison.py
      - test_product_acceptance.py
      - .github/workflows/gate-b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize artifact directory
        run: mkdir -p gate-b-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone pinned upstream (primary)
        run: |
          git clone --filter=blob:none https://github.com/OpenDPP/opendpp-interop.git /tmp/opendpp
          git -C /tmp/opendpp checkout --detach 20211ecc2b63eb7664c571a8d629aeeed364491e
          test "$(git -C /tmp/opendpp rev-parse HEAD)" = 20211ecc2b63eb7664c571a8d629aeeed364491e
          npm ci --prefix /tmp/opendpp/validate
      - name: Clone pinned upstream (independent replay)
        run: |
          git clone --filter=blob:none https://github.com/OpenDPP/opendpp-interop.git /tmp/opendpp-replay
          git -C /tmp/opendpp-replay checkout --detach 20211ecc2b63eb7664c571a8d629aeeed364491e
          test "$(git -C /tmp/opendpp-replay rev-parse HEAD)" = 20211ecc2b63eb7664c571a8d629aeeed364491e
          npm ci --prefix /tmp/opendpp-replay/validate
      - name: Execute and replay actual upstream validator
        run: python3 gate_b_bootstrap.py
      - name: Cross-check upstream OpenDPP AJV API against its CLI
        run: node external_module_contract.mjs
      - name: Install pinned official IDTA AAS test engine
        run: python3 -m pip install aas_test_engines==1.0.3
      - name: Failure-inject official AAS oracle adapter boundary
        run: python3 -m unittest -v test_aas_oracle_adapter.py
      - name: Cross-check AAS metamodel with independent official oracle
        run: python3 aas_oracle_adapter.py --bundle gate-b-evidence
      - name: Publish evidence-bound validator scope comparison
        run: python3 cross_validator_comparison.py --bundle gate-b-evidence
      - name: Adversarially test cross-validator evidence binding
        run: python3 -m unittest -v test_cross_validator_comparison.py
      - name: Independently test acceptance evaluator
        run: python3 -m unittest -v test_product_acceptance.py
      - name: Independently inspect the real Gate B artifact
        if: always()
        run: python3 product_acceptance.py --bundle gate-b-evidence
      - name: Upload observation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-real-observation
          path: gate-b-evidence/
          if-no-files-found: warn
          retention-days: 90
