services:
  validator:
    build:
      context: .
      dockerfile: Dockerfile
    image: dpp-coverage-probe:local
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
